name: iOS build template

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      xcode-version:
        required: false
        type: string
        default: 26.0.1

permissions:
  contents: read

jobs:
  configuration-required:
    name: Not configured - no build or release is claimed
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Stop before unconfigured work or native spend
        run: |
          echo '::error::This legacy template is not a configured build/release pipeline. Use the app-local workflow and verify its pinned toolchain, evidence and approvals first.'
          exit 78
